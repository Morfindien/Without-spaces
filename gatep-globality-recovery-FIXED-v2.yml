name: Bubbleverse Gate P - GLOBALITY RECOVERY

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  MAXICLASS_COMMIT: b5a3af9818d04d2fe696e54972545e8c6805f4ea
  ACT_COMMIT: 0e0cd2c703c62a0e980470b572602233b27750e1
  SPT_COMMIT: 2cec6e762a8c540484dd5acafc529f0035856350
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/.cobaya

jobs:
  recover-1ax:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ gfortran make git
      - name: Install frozen Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.37" "numpy==2.2.6" "scipy==1.15.3" "PyYAML==6.0.3" "cobaya==3.6.2" "Py-BOBYQA==1.5.0" "candl-like==2.0.3" "sacc==2.4" "astropy==6.1.7" "camb==1.5.9" "pytest==9.1.1"
      - name: Frozen mAxiCLASS
        run: |
          mkdir -p external
          git clone https://github.com/marcobeIIa/mAxiCLASS.git external/mAxiCLASS
          git -C external/mAxiCLASS checkout "$MAXICLASS_COMMIT"

          # Build frozen CLASS + Python extension directly into the repository
          # build/lib.* tree that Cobaya expects when `path:` points here.
          make -C external/mAxiCLASS clean || true
          make -C external/mAxiCLASS PYTHON="$(which python)" libclass.a -j2

          (
            cd external/mAxiCLASS
            rm -rf build/python-build build/lib.linux-*
            mkdir -p build/python-build
            python setup.py build               --build-base build/python-build
          )

          # Find the compiled classy extension produced by setup.py and copy
          # it into the exact legacy source-tree location Cobaya 3.6.2 checks:
          # external/mAxiCLASS/build/lib.<platform>-cpython-310/
          CLASSY_SO="$(find external/mAxiCLASS/build/python-build -type f \( -name 'classy*.so' -o -name 'classy*.pyd' \) | head -n 1)"
          if [ -z "$CLASSY_SO" ]; then
            echo "No compiled classy extension found after setup.py build"
            find external/mAxiCLASS/build -maxdepth 4 -type f | sort
            exit 1
          fi

          COBAYA_LIB="external/mAxiCLASS/build/lib.linux-x86_64-cpython-310"
          mkdir -p "$COBAYA_LIB"
          cp "$CLASSY_SO" "$COBAYA_LIB/"

          echo "Compiled classy extension:"
          ls -lh "$COBAYA_LIB"/classy*

          # Avoid site-packages shadowing the source-tree build.
          python -m pip uninstall -y classy || true

          # Hard validation from the exact directory Cobaya will request.
          python - <<'PY'
          import importlib.util
          from pathlib import Path
          root = Path("external/mAxiCLASS/build/lib.linux-x86_64-cpython-310").resolve()
          cands = list(root.glob("classy*.so"))
          print("Cobaya classy candidates:", cands)
          if not cands:
              raise SystemExit("No local classy extension for Cobaya")
          spec = importlib.util.spec_from_file_location("classy", cands[0])
          mod = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(mod)
          print("Loaded local classy from:", mod.__file__)
          if Path(mod.__file__).resolve().parent != root:
              raise SystemExit("classy loaded from wrong directory")
          PY

      - name: Frozen ACT DR6 + preserved official data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone https://github.com/ACTCollaboration/DR6-ACT-lite.git external/DR6-ACT-lite
          git -C external/DR6-ACT-lite checkout "$ACT_COMMIT"
          python -m pip install -e external/DR6-ACT-lite

          # Reuse exact ACT DR6 data artifact from successful frozen Gate-P run.
          ACT_DIR="$COBAYA_PACKAGES_PATH/data/ACTDR6CMBonly/v1.0"
          mkdir -p "$ACT_DIR"

          echo "Trying preserved ACT artifact 9533873703..."
          if gh api             -H "Accept: application/vnd.github+json"             "/repos/${{ github.repository }}/actions/artifacts/9533873703/zip"             > /tmp/act-dr6-data.zip
          then
            unzip -j /tmp/act-dr6-data.zip "dr6_data_cmbonly.fits" -d "$ACT_DIR"
          else
            echo "Preserved artifact unavailable; falling back to NERSC with retries."
            rm -f /tmp/act-dr6-data.zip
            mkdir -p "$COBAYA_PACKAGES_PATH"
            ok=0
            for attempt in 1 2 3 4; do
              echo "ACT cobaya-install attempt $attempt/4"
              if cobaya-install act_dr6_cmbonly --packages-path "$COBAYA_PACKAGES_PATH"; then
                ok=1
                break
              fi
              sleep $((attempt * 20))
            done
            if [ "$ok" -ne 1 ]; then
              echo "ACT DR6 data unavailable after artifact fallback and retries."
              exit 1
            fi
          fi

          test -s "$ACT_DIR/dr6_data_cmbonly.fits"
          ls -lh "$ACT_DIR/dr6_data_cmbonly.fits"
      - name: Frozen SPT-3G D1
        run: |
          git clone https://github.com/SouthPoleTelescope/spt_candl_data.git external/spt_candl_data
          git -C external/spt_candl_data checkout "$SPT_COMMIT"
          python -m pip install -e external/spt_candl_data
      - name: Record provenance
        run: |
          mkdir -p gatep_recovery/provenance
          python -m pip freeze > gatep_recovery/provenance/pip-freeze.txt
          git -C external/mAxiCLASS rev-parse HEAD > gatep_recovery/provenance/maxiclass-commit.txt
          git -C external/DR6-ACT-lite rev-parse HEAD > gatep_recovery/provenance/act-commit.txt
          git -C external/spt_candl_data rev-parse HEAD > gatep_recovery/provenance/spt-commit.txt
          cp scripts/GATEP_RECOVERY_PROVENANCE.md gatep_recovery/provenance/
      - name: ACT validation
        run: pytest -q --pyargs act_dr6_cmbonly | tee gatep_recovery/provenance/act-validation.log
      - name: Recover LCDM + 1ax
        run: python scripts/gatep_globality_recovery.py --stage 1ax --workdir gatep_recovery
      - name: Upload 1ax recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatep-globality-1ax
          path: gatep_recovery/
          retention-days: 30

  recover-2ax:
    needs: recover-1ax
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@v4
        with:
          name: gatep-globality-1ax
          path: gatep_recovery
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ gfortran make git
      - name: Install frozen Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.37" "numpy==2.2.6" "scipy==1.15.3" "PyYAML==6.0.3" "cobaya==3.6.2" "Py-BOBYQA==1.5.0" "candl-like==2.0.3" "sacc==2.4" "astropy==6.1.7" "camb==1.5.9" "pytest==9.1.1"
      - name: Frozen mAxiCLASS
        run: |
          mkdir -p external
          git clone https://github.com/marcobeIIa/mAxiCLASS.git external/mAxiCLASS
          git -C external/mAxiCLASS checkout "$MAXICLASS_COMMIT"

          # Build the frozen C/C++ library with the same Python interpreter
          # used by this GitHub runner.
          make -C external/mAxiCLASS clean || true
          make -C external/mAxiCLASS PYTHON="$(which python)" libclass.a -j2

          # Explicitly build/install the frozen Python wrapper. Do not rely on
          # the Makefile's captured pip output, because a pip failure can be
          # hidden by shell command substitution.
          (
            cd external/mAxiCLASS
            PYTHON="$(which python)" python -m pip install -v --no-build-isolation .
          )

          # Hard validation: the installed module MUST be this frozen build.
          python - <<'PY'
          import classy
          from pathlib import Path
          p = Path(classy.__file__).resolve()
          print("Frozen classy import:", p)
          print("classy version:", getattr(classy, "__version__", "unknown"))
          if not p.exists():
              raise SystemExit("classy import path does not exist")
          PY

          # Cobaya 3.6.2 with `theory: classy: path: .../mAxiCLASS` uses the
          # legacy source-tree loader and searches python/build/lib.* for the
          # compiled extension. Mirror the just-validated frozen extension
          # there without modifying any theory source.
          CLASSY_SO="$(python - <<'PY'
          import classy
          from pathlib import Path
          print(Path(classy.__file__).resolve())
          PY
          )"
          LOCAL_LIB="external/mAxiCLASS/python/build/lib.github-actions-py310"
          mkdir -p "$LOCAL_LIB"
          cp "$CLASSY_SO" "$LOCAL_LIB/"

          # Final validation using exactly the local source-tree layout Cobaya
          # will inspect in the Gate-P run.
          python - <<'PY'
          from pathlib import Path
          root = Path("external/mAxiCLASS/python/build")
          libs = list(root.glob("lib.*"))
          print("Cobaya-compatible local build dirs:", libs)
          if not libs:
              raise SystemExit("No local python/build/lib.* directory")
          sos = []
          for d in libs:
              sos.extend(d.glob("classy*.so"))
          print("Local classy extensions:", sos)
          if not sos:
              raise SystemExit("No classy extension copied into local build")
          PY
      - name: Frozen ACT DR6 + preserved official data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git clone https://github.com/ACTCollaboration/DR6-ACT-lite.git external/DR6-ACT-lite
          git -C external/DR6-ACT-lite checkout "$ACT_COMMIT"
          python -m pip install -e external/DR6-ACT-lite

          # Reuse exact ACT DR6 data artifact from successful frozen Gate-P run.
          ACT_DIR="$COBAYA_PACKAGES_PATH/data/ACTDR6CMBonly/v1.0"
          mkdir -p "$ACT_DIR"

          echo "Trying preserved ACT artifact 9533873703..."
          if gh api             -H "Accept: application/vnd.github+json"             "/repos/${{ github.repository }}/actions/artifacts/9533873703/zip"             > /tmp/act-dr6-data.zip
          then
            unzip -j /tmp/act-dr6-data.zip "dr6_data_cmbonly.fits" -d "$ACT_DIR"
          else
            echo "Preserved artifact unavailable; falling back to NERSC with retries."
            rm -f /tmp/act-dr6-data.zip
            mkdir -p "$COBAYA_PACKAGES_PATH"
            ok=0
            for attempt in 1 2 3 4; do
              echo "ACT cobaya-install attempt $attempt/4"
              if cobaya-install act_dr6_cmbonly --packages-path "$COBAYA_PACKAGES_PATH"; then
                ok=1
                break
              fi
              sleep $((attempt * 20))
            done
            if [ "$ok" -ne 1 ]; then
              echo "ACT DR6 data unavailable after artifact fallback and retries."
              exit 1
            fi
          fi

          test -s "$ACT_DIR/dr6_data_cmbonly.fits"
          ls -lh "$ACT_DIR/dr6_data_cmbonly.fits"
      - name: Frozen SPT-3G D1
        run: |
          git clone https://github.com/SouthPoleTelescope/spt_candl_data.git external/spt_candl_data
          git -C external/spt_candl_data checkout "$SPT_COMMIT"
          python -m pip install -e external/spt_candl_data
      - name: Record provenance
        run: |
          python -m pip freeze > gatep_recovery/provenance/pip-freeze-2ax.txt
          git -C external/mAxiCLASS rev-parse HEAD > gatep_recovery/provenance/maxiclass-commit-2ax.txt
          git -C external/DR6-ACT-lite rev-parse HEAD > gatep_recovery/provenance/act-commit-2ax.txt
          git -C external/spt_candl_data rev-parse HEAD > gatep_recovery/provenance/spt-commit-2ax.txt
      - name: Recover 2ax from recovered 1ax
        run: python scripts/gatep_globality_recovery.py --stage 2ax --workdir gatep_recovery
      - name: Build comparison report
        run: python scripts/gatep_globality_recovery.py --stage report --workdir gatep_recovery
      - name: Upload complete recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatep-globality-recovery
          path: gatep_recovery/
          retention-days: 30
