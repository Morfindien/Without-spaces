name: "Bubbleverse Gate P - Validate stack v2"

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

jobs:
  validate:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    env:
      PYTHONUNBUFFERED: "1"
      COBAYA_PACKAGES_PATH: ${{ github.workspace }}/.cobaya

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gfortran \
            git \
            pkg-config \
            libopenblas-dev \
            liblapack-dev

      - name: Install frozen Python stack
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install \
            "cobaya==3.6.2" \
            "candl-like==2.0.3" \
            "cython<3" \
            "camb==1.5.9" \
            pytest \
            sacc

          python - <<'PY'
          import sys
          import Cython
          import cobaya
          import camb
          import sacc
          print("Python:", sys.version)
          print("Cython:", Cython.__version__)
          print("Cobaya:", cobaya.__version__)
          print("CAMB:", camb.__version__)
          print("CAMB file:", camb.__file__)
          print("SACC:", getattr(sacc, "__version__", "unknown"))
          PY

      - name: Clone exact frozen source revisions
        run: |
          mkdir -p external results/validation provenance

          git clone https://github.com/marcobeIIa/mAxiCLASS.git external/mAxiCLASS
          git -C external/mAxiCLASS checkout --detach b5a3af9818d04d2fe696e54972545e8c6805f4ea
          test "$(git -C external/mAxiCLASS rev-parse HEAD)" = \
            "b5a3af9818d04d2fe696e54972545e8c6805f4ea"

          git clone https://github.com/ACTCollaboration/DR6-ACT-lite.git external/DR6-ACT-lite
          git -C external/DR6-ACT-lite checkout --detach 0e0cd2c703c62a0e980470b572602233b27750e1
          test "$(git -C external/DR6-ACT-lite rev-parse HEAD)" = \
            "0e0cd2c703c62a0e980470b572602233b27750e1"

          git clone https://github.com/SouthPoleTelescope/spt_candl_data.git external/spt_candl_data
          git -C external/spt_candl_data checkout --detach 2cec6e762a8c540484dd5acafc529f0035856350
          test "$(git -C external/spt_candl_data rev-parse HEAD)" = \
            "2cec6e762a8c540484dd5acafc529f0035856350"

      - name: Build frozen mAxiCLASS
        id: maxiclass_build
        run: |
          cd external/mAxiCLASS
          make clean || true

          # Build native CLASS first. Do not use Makefile's "classy" target:
          # its internal "pip install ." uses build isolation and loses Cython.
          PYTHON=python make -j2 class libclass.a

          # Use the pinned runner Cython without PEP-517 build isolation.
          python -m pip install --no-build-isolation .

          python - <<'PY'
          import Cython
          from classy import Class
          c = Class()
          print("Cython version:", Cython.__version__)
          print("mAxiCLASS classy import OK:", type(c).__name__)
          PY

      - name: Smoke-test upstream mAxiCLASS example
        id: maxiclass_smoke
        run: |
          cd external/mAxiCLASS
          mkdir -p output
          timeout 25m ./class 1shooting_maxiclass.ini \
            > ../../results/validation/maxiclass_1shooting.log 2>&1

      - name: Install ACT DR6 primary likelihood
        run: |
          python -m pip install -e external/DR6-ACT-lite
          mkdir -p "$COBAYA_PACKAGES_PATH"

          # Install ACT primary data only. Gate P does NOT use PlanckActCut.
          cobaya-install act_dr6_cmbonly

          # Critical: the upstream pytest test_install() installs the current
          # Cobaya CAMB into packages_path, which made run #8 use a 2026 CAMB.
          # For reproduction of the March-2025 ACT reference, force the global
          # pinned CAMB 1.5.9 (released Dec 2024, contemporary with the ACT CI).
          rm -rf "$COBAYA_PACKAGES_PATH/code/CAMB"

      - name: Validate ACT DR6 primary reference
        id: act_primary
        continue-on-error: true
        run: |
          python - <<'PY' 2>&1 | tee results/validation/act_primary_reference.log
          import json
          import numpy as np
          import camb
          from pathlib import Path
          from cobaya.model import get_model

          print("CAMB version:", camb.__version__)
          print("CAMB file:", camb.__file__)

          if camb.__version__ != "1.5.9":
              raise RuntimeError(
                  f"Expected global CAMB 1.5.9, got {camb.__version__}"
              )

          info = {
              "params": {
                  "ombh2": 0.022,
                  "omch2": 0.117,
                  "ns": 0.96,
                  "As": 2e-9,
                  "tau": 0.065,
                  "cosmomc_theta": 104.09e-4,
              },
              "theory": {
                  "camb": {
                      "extra_args": {
                          "lmax": 9000,
                          "lens_potential_accuracy": 8,
                          "min_l_logl_sampling": 6000,
                      }
                  }
              },
              "likelihood": {
                  "act_dr6_cmbonly": {
                      "stop_at_error": True,
                      "input_file": "dr6_data_cmbonly.fits",
                      "params": {
                          "A_act": 1.0,
                          "P_act": 1.0,
                      },
                  }
              },
              "sampler": {"evaluate": None},
              "debug": True,
          }

          model = get_model(info)
          loglike = float(sum(model.loglikes()[0]))
          expected = -395.48
          difference = loglike - expected
          passed = bool(np.isclose(loglike, expected))

          result = {
              "actual_loglike": loglike,
              "expected_loglike": expected,
              "difference": difference,
              "np_isclose_default": passed,
              "camb_version": camb.__version__,
              "camb_file": camb.__file__,
          }

          Path("results/validation/act_primary_reference.json").write_text(
              json.dumps(result, indent=2) + "\n"
          )

          print("\nACT DR6 PRIMARY REFERENCE")
          print("actual:  ", loglike)
          print("expected:", expected)
          print("delta:   ", difference)
          print("pass:    ", passed)

          if not passed:
              raise AssertionError(
                  "ACT DR6 primary TT/TE/EE reference still does not reproduce."
              )
          PY

      - name: Install SPT-3G D1 frozen T&E stack
        run: |
          python -m pip install "candl-like==2.0.3"
          python -m pip install -e external/spt_candl_data

      - name: Validate only Gate-P-relevant SPT T&E
        id: spt_tne
        continue-on-error: true
        run: |
          python - <<'PY' 2>&1 | tee results/validation/spt_tne_tests.log
          import io
          from contextlib import redirect_stdout, redirect_stderr
          from pathlib import Path

          import candl
          import spt_candl_data
          from candl.tests import run_test

          tests_dir = Path(spt_candl_data.__file__).resolve().parent / "tests"
          required = [
              tests_dir / "SPT3G_D1_TnE_test.yaml",
              tests_dir / "SPT3G_D1_TnE_lite_test.yaml",
          ]

          print("candl:", candl.__file__)
          print("spt_candl_data:", spt_candl_data.__file__)

          failures = []

          for test_path in required:
              print("\n=== RUNNING", test_path.name, "===")
              buf = io.StringIO()

              try:
                  with redirect_stdout(buf), redirect_stderr(buf):
                      run_test(str(test_path))
              except Exception as exc:
                  buf.write(f"\nEXCEPTION: {type(exc).__name__}: {exc}\n")

              text = buf.getvalue()
              print(text)

              if ("Test passed" not in text) or ("Failed" in text) or ("EXCEPTION:" in text):
                  failures.append(test_path.name)

          if failures:
              raise AssertionError(
                  "Gate-P-relevant SPT T&E validation failed: "
                  + ", ".join(failures)
              )

          print("All Gate-P-relevant SPT T&E tests passed.")
          PY

      - name: Record exact provenance
        if: always()
        run: |
          mkdir -p provenance results/validation

          {
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "uname=$(uname -a)"
            echo "python=$(python --version 2>&1)"
            echo "pip=$(python -m pip --version)"
            echo "gcc=$(gcc --version | head -n1)"
            python - <<'PY'
          import camb, cobaya, Cython
          try:
              import sacc
              sacc_version = getattr(sacc, "__version__", "unknown")
          except Exception:
              sacc_version = "unavailable"
          print("camb=" + camb.__version__)
          print("cobaya=" + cobaya.__version__)
          print("cython=" + Cython.__version__)
          print("sacc=" + str(sacc_version))
          PY
            if [ -d external/mAxiCLASS/.git ]; then
              echo "mAxiCLASS=$(git -C external/mAxiCLASS rev-parse HEAD)"
            fi
            if [ -d external/DR6-ACT-lite/.git ]; then
              echo "ACT_DR6=$(git -C external/DR6-ACT-lite rev-parse HEAD)"
            fi
            if [ -d external/spt_candl_data/.git ]; then
              echo "SPT_candl_data=$(git -C external/spt_candl_data rev-parse HEAD)"
            fi
            echo "maxiclass_build=${{ steps.maxiclass_build.outcome }}"
            echo "maxiclass_smoke=${{ steps.maxiclass_smoke.outcome }}"
            echo "act_primary=${{ steps.act_primary.outcome }}"
            echo "spt_tne=${{ steps.spt_tne.outcome }}"
          } | tee provenance/runtime-environment.txt

          python -m pip freeze | sort > provenance/runtime-pip-freeze.txt

      - name: Write Gate-P lock record
        if: always()
        run: |
          cat > provenance/HYP004C_GATEP_LOCK.txt <<'EOF'
          CASE-Q013
          HYP-004C frozen candidate

          N_ax = 2
          potential exponent n = 3
          theta1 = theta2 = 2.8
          theta_prime1 = theta_prime2 = 0

          log10 zc1 in [3.0, 3.75]
          log10 zc2 in [3.75, 4.5]
          f_ax1,f_ax2 in [0,0.3]

          Equivalent log10(a_c) ranges:
          field1 [-3.7500772228,-3.0004340775]
          field2 [-4.5000137334,-3.7500772228]

          Gate P:
          ACT DR6 primary TT/TE/EE
          + SPT-3G D1 primary TT/TE/EE
          + explicit tau prior
          no lensing

          delta_chi2_P = chi2_2ax - chi2_1ax
          delta_AIC_P = delta_chi2_P + 4
          AIC neutrality at delta_chi2_P = -4

          VALIDATION V2:
          - mAxiCLASS frozen source/build is checked.
          - ACT primary is tested against the upstream -395.48 reference
            using pinned CAMB 1.5.9 rather than a 2026 Cobaya-installed CAMB.
          - PlanckActCut is deliberately excluded because Gate P does not use it.
          - SPT validation is restricted to D1 T&E and D1 T&E lite; BB is excluded.
          - Pipeline failures are no longer hidden by tee/pipe behavior.

          NOTE:
          This workflow validates the software/likelihood stack only.
          The final LCDM/1ax/2ax fit remains blocked until the exact
          frozen base-cosmology priors/parameterisation and exact
          Cobaya -> mAxiCLASS multifield serialization are recovered.
          EOF

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatep-validation-v2-${{ github.run_id }}
          path: |
            results/validation/
            provenance/
          if-no-files-found: warn
          retention-days: 30

      - name: Enforce honest validation verdict
        if: always()
        run: |
          echo "mAxiCLASS build: ${{ steps.maxiclass_build.outcome }}"
          echo "mAxiCLASS smoke: ${{ steps.maxiclass_smoke.outcome }}"
          echo "ACT primary:     ${{ steps.act_primary.outcome }}"
          echo "SPT T&E:         ${{ steps.spt_tne.outcome }}"

          test "${{ steps.maxiclass_build.outcome }}" = "success"
          test "${{ steps.maxiclass_smoke.outcome }}" = "success"
          test "${{ steps.act_primary.outcome }}" = "success"
          test "${{ steps.spt_tne.outcome }}" = "success"

          echo "All Gate-P validation components passed honestly."
