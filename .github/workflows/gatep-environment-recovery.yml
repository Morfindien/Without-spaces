name: Bubbleverse Gate P - ENVIRONMENT RECOVERY

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/.cobaya

  # Frozen Gate-P provenance. DO NOT change these to make a run pass.
  MAXICLASS_COMMIT: b5a3af9818d04d2fe696e54972545e8c6805f4ea
  ACT_COMMIT: 0e0cd2c703c62a0e980470b572602233b27750e1
  SPT_COMMIT: 2cec6e762a8c540484dd5acafc529f0035856350

jobs:
  environment-recovery:
    # Match the successful Globality Recovery runner family first.
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout Bubbleverse repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system build tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            gfortran \
            make \
            git \
            git-lfs \
            unzip

      - name: Install frozen Python runtime
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            "Cython==0.29.37" \
            "numpy==2.2.6" \
            "scipy==1.15.3" \
            "PyYAML==6.0.3" \
            "cobaya==3.6.2" \
            "Py-BOBYQA==1.5.0" \
            "candl-like==2.0.3" \
            "sacc==2.4" \
            "astropy==6.1.7" \
            "camb==1.5.9" \
            "pytest==9.1.1" \
            "pandas==2.3.3"

      - name: Clone frozen Gate-P sources
        run: |
          set -euxo pipefail
          rm -rf external/mAxiCLASS external/DR6-ACT-lite external/spt_candl_data
          mkdir -p external

          git clone https://github.com/marcobeIIa/mAxiCLASS.git external/mAxiCLASS
          git -C external/mAxiCLASS checkout "$MAXICLASS_COMMIT"

          git clone https://github.com/ACTCollaboration/DR6-ACT-lite.git external/DR6-ACT-lite
          git -C external/DR6-ACT-lite checkout "$ACT_COMMIT"

          git clone https://github.com/SouthPoleTelescope/spt_candl_data.git external/spt_candl_data
          git -C external/spt_candl_data checkout "$SPT_COMMIT"
          git -C external/spt_candl_data lfs pull || true

          test "$(git -C external/mAxiCLASS rev-parse HEAD)" = "$MAXICLASS_COMMIT"
          test "$(git -C external/DR6-ACT-lite rev-parse HEAD)" = "$ACT_COMMIT"
          test "$(git -C external/spt_candl_data rev-parse HEAD)" = "$SPT_COMMIT"

      - name: Install frozen mAxiCLASS WITH package data
        run: |
          set -euxo pipefail

          # Differential Debug #3 only ran `setup.py build`. That compiles the
          # extension but does NOT install the package-data tree used by CLASS
          # at runtime (including external/bbn/sBBN_2025.dat).
          #
          # Remove any stale/shadowing CLASS Python installation first.
          python -m pip uninstall -y classy || true

          # Build/install the frozen source itself. setup.py declares the full
          # CLASS tree as package data under site-packages/class/.
          (
            cd external/mAxiCLASS
            make clean || true
            make PYTHON="$(which python)" libclass.a -j2
            PYTHON="$(which python)" \
              python -m pip install -v --no-build-isolation --no-deps .
          )

          python - <<'PY'
          import importlib.util
          from pathlib import Path
          import classy

          print("classy.__file__ =", Path(classy.__file__).resolve())

          spec = importlib.util.find_spec("class")
          if spec is None:
              raise SystemExit("FAIL: installed mAxiCLASS data package 'class' not found")

          if spec.submodule_search_locations:
              class_root = Path(next(iter(spec.submodule_search_locations))).resolve()
          elif spec.origin:
              class_root = Path(spec.origin).resolve().parent
          else:
              raise SystemExit("FAIL: unable to resolve installed 'class' package root")

          bbn = class_root / "external" / "bbn" / "sBBN_2025.dat"

          print("CLASS package-data root =", class_root)
          print("Required BBN file =", bbn)

          if not bbn.is_file():
              raise SystemExit(f"FAIL: missing {bbn}")
          if bbn.stat().st_size <= 0:
              raise SystemExit(f"FAIL: empty {bbn}")

          with bbn.open("rb") as f:
              f.read(1)

          print("BBN package-data gate: PASS")
          PY

      - name: Install frozen ACT likelihood
        run: |
          set -euxo pipefail
          python -m pip install -e external/DR6-ACT-lite

      - name: Restore frozen ACT data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ACT_DIR="$COBAYA_PACKAGES_PATH/data/ACTDR6CMBonly/v1.0"
          ACT_FILE="$ACT_DIR/dr6_data_cmbonly.fits"
          mkdir -p "$ACT_DIR"

          # Prefer the preserved data artifact used by the successful frozen
          # Gate-P recovery. If unavailable, use the official installer.
          if gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/artifacts/9533873703/zip" \
              > /tmp/act-dr6-data.zip
          then
            unzip -j -o \
              /tmp/act-dr6-data.zip \
              "dr6_data_cmbonly.fits" \
              -d "$ACT_DIR"
          else
            rm -f /tmp/act-dr6-data.zip
            cobaya-install \
              act_dr6_cmbonly \
              --packages-path "$COBAYA_PACKAGES_PATH"
          fi

          test -s "$ACT_FILE"
          sha256sum "$ACT_FILE"

      - name: Install frozen SPT-3G D1 data package
        run: |
          set -euxo pipefail

          # The frozen SouthPoleTelescope repository installs the Python
          # package `spt_candl_data`. `candl_data` is a separate optional
          # candl data library and is NOT required for this frozen SPT-D1 path.
          python -m pip install -e external/spt_candl_data

          python - <<'PY'
          from pathlib import Path
          import candl
          import spt_candl_data

          print("candl =", Path(candl.__file__).resolve())
          print("spt_candl_data =", Path(spt_candl_data.__file__).resolve())

          frozen = Path("external/spt_candl_data").resolve()
          loaded = Path(spt_candl_data.__file__).resolve()

          try:
              loaded.relative_to(frozen)
          except ValueError:
              raise SystemExit(
                  f"FAIL: spt_candl_data loaded from {loaded}, "
                  f"not frozen checkout {frozen}"
              )

          print("spt_candl_data frozen-source gate: PASS")
          PY

      - name: Record recovery provenance
        if: always()
        run: |
          set -u
          mkdir -p gatep_environment_recovery/provenance

          python --version \
            > gatep_environment_recovery/provenance/python-version.txt 2>&1 || true
          python -m pip freeze \
            > gatep_environment_recovery/provenance/pip-freeze.txt 2>&1 || true

          git rev-parse HEAD \
            > gatep_environment_recovery/provenance/bubbleverse-commit.txt 2>&1 || true
          git -C external/mAxiCLASS rev-parse HEAD \
            > gatep_environment_recovery/provenance/maxiclass-commit.txt 2>&1 || true
          git -C external/DR6-ACT-lite rev-parse HEAD \
            > gatep_environment_recovery/provenance/act-commit.txt 2>&1 || true
          git -C external/spt_candl_data rev-parse HEAD \
            > gatep_environment_recovery/provenance/spt-commit.txt 2>&1 || true

          python - <<'PY' > gatep_environment_recovery/provenance/import-paths.txt 2>&1 || true
          import importlib.util
          from pathlib import Path

          for name in ("classy", "class", "act_dr6_cmbonly", "candl", "spt_candl_data"):
              spec = importlib.util.find_spec(name)
              print(name, "=>", None if spec is None else {
                  "origin": spec.origin,
                  "locations": list(spec.submodule_search_locations or []),
              })
          PY

      - name: Hard environment preflight
        run: |
          set -euxo pipefail
          test -s scripts/gatep_environment_preflight.py
          python scripts/gatep_environment_preflight.py

      - name: ACT software validation
        run: |
          set -euxo pipefail
          mkdir -p gatep_environment_recovery/benchmarks
          pytest -q --pyargs act_dr6_cmbonly \
            | tee gatep_environment_recovery/benchmarks/act-validation.log

      - name: Run recovered differential reference chain
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          set -euxo pipefail

          # Use the existing Bubbleverse differential program after the
          # environment has passed every hard gate.
          python scripts/gatep_differential_debug.py

          # Preserve it under this recovery artifact as well.
          rm -rf gatep_environment_recovery/differential_debug
          cp -a \
            gatep_differential_debug \
            gatep_environment_recovery/differential_debug

      - name: Enforce known-good numerical recovery
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import math
          from pathlib import Path

          R1 = 317.4238643933
          OLD_ZERO = 317.4201095748994
          TOL = 0.1

          root = Path("gatep_environment_recovery/differential_debug")
          summary = root / "differential_debug.json"
          if not summary.exists():
              # Be tolerant to the exact filename currently emitted by the
              # differential script, but never silently pass.
              candidates = list(root.glob("*.json"))
              if not candidates:
                  raise SystemExit("FAIL: no differential JSON result produced")
              summary = candidates[0]

          data = json.loads(summary.read_text())

          # Find the known-good zero-boundary result regardless of whether the
          # current JSON stores tests as a list or dict.
          tests = data.get("results", data.get("tests", data))
          rows = []
          if isinstance(tests, dict):
              for key, value in tests.items():
                  if isinstance(value, dict):
                      row = dict(value)
                      row.setdefault("label", key)
                      rows.append(row)
          elif isinstance(tests, list):
              rows = [r for r in tests if isinstance(r, dict)]

          target = next(
              (r for r in rows if r.get("label") == "known_good_globality_cli"),
              None,
          )
          if target is None:
              raise SystemExit("FAIL: known_good_globality_cli result missing")

          if not target.get("usable_finite", False):
              raise SystemExit(
                  "FAIL: known_good_globality_cli is still non-finite"
              )

          eff = target.get("effective_chi2")
          if not isinstance(eff, (int, float)) or not math.isfinite(eff):
              raise SystemExit(
                  f"FAIL: finite effective chi2 missing from known-good case: {eff!r}"
              )

          if abs(eff - OLD_ZERO) > TOL:
              raise SystemExit(
                  f"FAIL: 2ax zero not reproduced: chi2={eff}, "
                  f"old={OLD_ZERO}, |delta|={abs(eff-OLD_ZERO)} > {TOL}"
              )

          if abs(eff - R1) > TOL:
              raise SystemExit(
                  f"FAIL: 2ax zero not consistent with R1: chi2={eff}, "
                  f"R1={R1}, |delta|={abs(eff-R1)} > {TOL}"
              )

          act = target.get("chi2_ACT_log")
          spt = target.get("chi2_SPT_log")
          if not all(
              isinstance(x, (int, float)) and math.isfinite(x)
              for x in (act, spt)
          ):
              raise SystemExit(
                  f"FAIL: ACT/SPT components not individually finite: "
                  f"ACT={act!r}, SPT={spt!r}"
              )

          print("KNOWN-GOOD REFERENCE CHAIN: RECOVERED")
          print("effective_chi2 =", eff)
          print("delta vs previous 2ax zero =", eff - OLD_ZERO)
          print("delta vs R1 =", eff - R1)
          PY

      - name: Build environment recovery summary
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          out = Path("gatep_environment_recovery")
          out.mkdir(exist_ok=True)
          report = out / "ENVIRONMENT_RECOVERY_REPORT.md"

          preflight = out / "PREFLIGHT_REPORT.md"
          diff = out / "differential_debug" / "DIFFERENTIAL_DEBUG_REPORT.md"

          text = [
              "# CASE-Q013 — Gate-P Environment Recovery",
              "",
              "This workflow repairs and validates the shared runtime before "
              "any Gate-P nesting interpretation is allowed.",
              "",
              "Hard rule: any missing dependency, missing BBN data, NaN, inf, "
              "-inf, crash, missing likelihood component, or missing result is "
              "**INVALID FOR NESTING**.",
              "",
          ]

          if preflight.exists():
              text += ["## Preflight", "", preflight.read_text(), ""]
          if diff.exists():
              text += ["## Differential reference chain", "", diff.read_text(), ""]

          report.write_text("\n".join(text))
          PY

          cat gatep_environment_recovery/ENVIRONMENT_RECOVERY_REPORT.md \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload complete environment recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatep-environment-recovery-${{ github.run_id }}
          path: gatep_environment_recovery/
          if-no-files-found: warn
          retention-days: 90
