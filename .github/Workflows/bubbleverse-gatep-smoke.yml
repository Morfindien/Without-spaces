name: "Bubbleverse Gate P - Smoke Test"

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm GitHub Actions works
        run: |
          echo "Bubbleverse Gate P smoke test started"
          echo "Repository: $GITHUB_REPOSITORY"
          echo "Branch: $GITHUB_REF_NAME"
          echo "Runner OS: $RUNNER_OS"
          python3 --version
          git --version
          echo "SMOKE TEST PASSED"
