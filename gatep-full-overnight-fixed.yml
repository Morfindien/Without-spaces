name: "Bubbleverse Gate P - FULL overnight fit"

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash --noprofile --norc -eo pipefail {0}

env:
  PYTHONUNBUFFERED: "1"
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/.cobaya

  MAXICLASS_SHA: "b5a3af9818d04d2fe696e54972545e8c6805f4ea"
  ACT_SHA: "0e0cd2c703c62a0e980470b572602233b27750e1"
  SPT_SHA: "2cec6e762a8c540484dd5acafc529f0035856350"

jobs:

  # ==========================================================
  # THREE PARALLEL GATE-P FITS
  # ==========================================================
  fit:
    name: "Gate-P ${{ matrix.model }}"
    runs-on: ubuntu-22.04
    timeout-minutes: 350

    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        model:
          - lcdm
          - 1ax
          - 2ax

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gfortran \
            git \
            pkg-config \
            libopenblas-dev \
            liblapack-dev

      - name: Install frozen Python stack
        run: |
          python -m pip install --upgrade pip wheel setuptools

          python -m pip install \
            "cobaya==3.6.2" \
            "candl-like==2.0.3" \
            "cython<3" \
            "camb==1.5.9" \
            "sacc" \
            "pytest"

          python - <<'PY'
          import sys
          import Cython
          import cobaya
          import camb

          print("Python:", sys.version)
          print("Cython:", Cython.__version__)
          print("Cobaya:", cobaya.__version__)
          print("CAMB validation package:", camb.__version__)
          PY

      - name: Clone exact frozen source revisions
        run: |
          mkdir -p external chains results/${{ matrix.model }} provenance

          git clone https://github.com/marcobeIIa/mAxiCLASS.git external/mAxiCLASS
          git -C external/mAxiCLASS checkout --detach "$MAXICLASS_SHA"
          test "$(git -C external/mAxiCLASS rev-parse HEAD)" = "$MAXICLASS_SHA"

          git clone https://github.com/ACTCollaboration/DR6-ACT-lite.git external/DR6-ACT-lite
          git -C external/DR6-ACT-lite checkout --detach "$ACT_SHA"
          test "$(git -C external/DR6-ACT-lite rev-parse HEAD)" = "$ACT_SHA"

          git clone https://github.com/SouthPoleTelescope/spt_candl_data.git external/spt_candl_data
          git -C external/spt_candl_data checkout --detach "$SPT_SHA"
          test "$(git -C external/spt_candl_data rev-parse HEAD)" = "$SPT_SHA"

      - name: Build frozen mAxiCLASS for Cobaya source-path loading
        run: |
          cd external/mAxiCLASS
          make clean || true

          # Build the CLASS core first, then build the Python wrapper INTO
          # this source tree. Cobaya's `theory.classy.path` loader searches
          # <mAxiCLASS>/build/lib.* for a custom CLASS installation.
          # A normal `pip install .` puts classy in site-packages instead,
          # which Cobaya correctly rejects when a source path is pinned.
          PYTHON=python make -j2 class libclass.a
          PYTHON=python python setup.py build

          # Verify the exact artifact Cobaya is going to load. Do not accept
          # an unrelated globally installed `classy` from site-packages.
          python - <<'PY'
          import glob
          import importlib
          import os
          import sys
          from pathlib import Path

          import Cython

          root = Path.cwd().resolve()
          build_dirs = sorted(glob.glob(str(root / "build" / "lib.*")))
          if not build_dirs:
              raise RuntimeError(f"No local mAxiCLASS build/lib.* directory under {root}")

          # Put the local build first and make sure no previously imported
          # global classy module can mask it.
          sys.modules.pop("classy", None)
          sys.path.insert(0, build_dirs[-1])
          classy = importlib.import_module("classy")
          classy_file = Path(classy.__file__).resolve()

          if root not in classy_file.parents:
              raise RuntimeError(
                  "Wrong classy loaded: expected local mAxiCLASS under "
                  f"{root}, got {classy_file}"
              )

          c = classy.Class()
          print("Cython:", Cython.__version__)
          print("mAxiCLASS build dir:", build_dirs[-1])
          print("mAxiCLASS classy file:", classy_file)
          print("mAxiCLASS classy import:", type(c).__name__)
          PY

      - name: Install ACT DR6 and SPT-3G D1 likelihoods
        run: |
          python -m pip install -e external/DR6-ACT-lite
          mkdir -p "$COBAYA_PACKAGES_PATH"
          cobaya-install act_dr6_cmbonly

          python -m pip install "candl-like==2.0.3"
          python -m pip install -e external/spt_candl_data

      - name: Record frozen execution contract
        run: |
          cat > provenance/GATEP_OVERNIGHT_CONTRACT.txt <<'EOF'
          BUBBLEVERSE — CASE-Q013 — GATE P

          DATA:
          ACT DR6 primary TT/TE/EE, ell=600..8500
          SPT-3G D1 primary TT/TE/EE, lite likelihood
          tau_reio Gaussian information: N(0.051,0.006^2)
          NO CMB lensing likelihood

          ACT nuisance:
          A_act hard [0.5,1.5]
          P_act hard [0.9,1.1]
          A_act calibration Gaussian N(1,0.003^2)

          SPT nuisance:
          clear_internal_priors = true
          Tcal hard [0.8,1.2]
          Ecal hard [0.8,1.2]
          Tcal Gaussian N(1,0.0036^2)

          BASE PARAMETERISATION:
          H0, omega_b, omega_cdm, logA -> A_s, n_s, tau_reio

          BASE EXECUTION BOUNDS:
          logA      [1.61,3.91]
          n_s       [0.8,1.2]
          H0        [20,100]
          omega_b   [0.005,0.1]
          omega_cdm [0.001,0.99]

          These base bounds are the public mAxiCLASS Cobaya bounds at the
          frozen source revision. They are execution bounds for the
          frequentist minimisation. Exact K18 production-prior provenance
          is not claimed by this workflow.

          NEUTRINO BASELINE:
          N_ur=2.0328
          N_ncdm=1
          m_ncdm=0.06 eV
          T_ncdm=0.71611

          HYP-004C:
          N_ax=2
          n=3
          theta1=theta2=2.8
          theta_prime1=theta_prime2=0
          f_ax1,f_ax2 in [0,0.3]

          physical prior:
          log10 zc1 in [3,3.75]
          log10 zc2 in [3.75,4.5]

          exact a_c parameter ranges:
          log10 ac1 [-3.7500772228,-3.0004340775]
          log10 ac2 [-4.5000137334,-3.7500772228]

          Frozen 1ax comparator:
          n=3
          theta=2.8
          theta_prime=0
          f_ax in [0,0.3]
          log10 ac [-4.5000137334,-3.0004340775]

          SERIALISATION:
          mAxiCLASS parser_read_list_of_doubles uses comma-separated lists.
          Therefore 2-field inputs are passed as strings:
          n_axion_mscf       = "3,3"
          theta_ini_mscf     = "2.8,2.8"
          theta_prime_ini_mscf = "0.,0."
          log10_maxion_ac    = "ac1,ac2"
          fraction_maxion_ac = "f1,f2"

          Zero fractions are regularised internally to 1e-12 only when
          passed to the shooting solver. The sampled physical parameter
          remains allowed to reach the frozen boundary f=0.

          MODEL COMPARISON:
          delta_chi2_P = chi2_2ax - chi2_1ax
          delta_AIC_P = delta_chi2_P + 4
          AIC neutrality: delta_chi2_P = -4

          No Wilks/sigma conversion is performed.

          IMPORTANT:
          This overnight run obtains direct ACT+SPT primary-CMB numerical
          minima. A final Gate-P verdict still requires the dedicated
          theory-precision gate |delta chi2_theory| <= 0.1 and, if the
          2ax fit improves, high-l decomposition around ell~800-1200.
          EOF

      - name: Write Gate-P fitting engine
        run: |
          cat > run_gatep_fit.py <<'PY'
          import copy
          import json
          import math
          import os
          import re
          import sys
          import time
          from pathlib import Path

          import numpy as np
          import spt_candl_data
          from candl.interface import CandlCobayaLikelihood
          from cobaya.run import run

          MODEL = os.environ["GATEP_MODEL"]
          ROOT = Path.cwd()
          MAXI = ROOT / "external" / "mAxiCLASS"
          RESULT_DIR = ROOT / "results" / MODEL
          RESULT_DIR.mkdir(parents=True, exist_ok=True)
          (ROOT / "chains").mkdir(exist_ok=True)

          if MODEL not in {"lcdm", "1ax", "2ax"}:
              raise ValueError(MODEL)

          # ----------------------------------------------------
          # Frozen/common parameter block
          # ----------------------------------------------------
          params = {
              "logA": {
                  "prior": {"min": 1.61, "max": 3.91},
                  "ref": 3.05,
                  "proposal": 0.002,
                  "drop": True,
                  "latex": r"\log(10^{10} A_s)",
              },
              "A_s": {
                  "value": "lambda logA: 1e-10*np.exp(logA)",
                  "latex": "A_s",
              },
              "n_s": {
                  "prior": {"min": 0.8, "max": 1.2},
                  "ref": 0.965 if MODEL == "lcdm" else 0.98,
                  "proposal": 0.003,
                  "latex": "n_s",
              },
              "H0": {
                  "prior": {"min": 20.0, "max": 100.0},
                  "ref": 68.0 if MODEL == "lcdm" else (69.5 if MODEL == "1ax" else 70.46),
                  "proposal": 1.0,
                  "latex": "H_0",
              },
              "omega_b": {
                  "prior": {"min": 0.005, "max": 0.1},
                  "ref": 0.0224 if MODEL != "2ax" else 0.02248,
                  "proposal": 0.0001,
                  "latex": r"\Omega_b h^2",
              },
              "omega_cdm": {
                  "prior": {"min": 0.001, "max": 0.99},
                  "ref": 0.12 if MODEL == "lcdm" else 0.13,
                  "proposal": 0.001,
                  "latex": r"\Omega_c h^2",
              },
              "m_ncdm": {
                  "value": 0.06,
              },

              # Gate-P tau information is included as a Gaussian prior.
              # It is explicitly added back to effective chi2 below.
              "tau_reio": {
                  "prior": {
                      "dist": "norm",
                      "loc": 0.051,
                      "scale": 0.006,
                  },
                  "ref": 0.051,
                  "proposal": 0.003,
                  "latex": r"\tau_{\rm reio}",
              },

              # SPT D1 lite nuisance parameters
              "Tcal": {
                  "prior": {"min": 0.8, "max": 1.2},
                  "ref": 1.0,
                  "proposal": 0.003,
              },
              "Ecal": {
                  "prior": {"min": 0.8, "max": 1.2},
                  "ref": 1.0,
                  "proposal": 0.003,
              },
          }

          # ----------------------------------------------------
          # Frozen EDE parameter blocks
          # ----------------------------------------------------
          if MODEL == "1ax":
              params.update({
                  "log10_maxion_ac": {
                      "prior": {
                          "min": -4.5000137334,
                          "max": -3.0004340775,
                      },
                      "ref": -3.683,
                      "proposal": 0.08,
                      "latex": r"\log_{10}a_c",
                  },
                  "fraction_maxion_ac": {
                      "prior": {"min": 0.0, "max": 0.3},
                      "ref": 0.05,
                      "proposal": 0.015,
                      "latex": "f_ax",
                  },
              })

          if MODEL == "2ax":
              params.update({
                  "log10_ac1": {
                      "prior": {
                          "min": -3.7500772228,
                          "max": -3.0004340775,
                      },
                      "ref": -3.473,
                      "proposal": 0.06,
                      "drop": True,
                  },
                  "log10_ac2": {
                      "prior": {
                          "min": -4.5000137334,
                          "max": -3.7500772228,
                      },
                      "ref": -4.017,
                      "proposal": 0.08,
                      "drop": True,
                  },
                  "f_ax1": {
                      "prior": {"min": 0.0, "max": 0.3},
                      "ref": 0.05,
                      "proposal": 0.015,
                      "drop": True,
                  },
                  "f_ax2": {
                      "prior": {"min": 0.0, "max": 0.3},
                      "ref": 0.025,
                      "proposal": 0.015,
                      "drop": True,
                  },

                  # Exact comma-separated CLASS parser inputs.
                  # Numerical epsilon only prevents the shooting code from
                  # rejecting an exactly-zero target; sampled f_i still has
                  # the physical frozen lower bound zero.
                  "log10_maxion_ac": {
                      "value": (
                          'lambda log10_ac1, log10_ac2: '
                          '"%.16g,%.16g" % (log10_ac1, log10_ac2)'
                      ),
                      "derived": False,
                  },
                  "fraction_maxion_ac": {
                      "value": (
                          'lambda f_ax1, f_ax2: '
                          '"%.16g,%.16g" % '
                          '(f_ax1 if f_ax1 > 1e-12 else 1e-12, '
                          ' f_ax2 if f_ax2 > 1e-12 else 1e-12)'
                      ),
                      "derived": False,
                  },
              })

          # ----------------------------------------------------
          # ACT DR6 primary TT/TE/EE
          # No Planck low-l and no lensing likelihood.
          # ----------------------------------------------------
          act_name = "act_dr6_cmbonly.ACTDR6CMBonly"

          likelihood = {
              act_name: {
                  "input_file": "dr6_data_cmbonly.fits",
                  "lmax_theory": 9000,
                  "ell_cuts": {
                      "TT": [600, 8500],
                      "TE": [600, 8500],
                      "EE": [600, 8500],
                  },
                  "stop_at_error": True,
                  "params": {
                      "A_act": {
                          "prior": {"min": 0.5, "max": 1.5},
                          "ref": 1.0,
                          "proposal": 0.003,
                      },
                      "P_act": {
                          "prior": {"min": 0.9, "max": 1.1},
                          "ref": 1.0,
                          "proposal": 0.01,
                      },
                  },
              },

              # SPT-3G D1 TT/TE/EE lite likelihood
              "candl_like": {
                  "external": CandlCobayaLikelihood,
                  "data_set_file": spt_candl_data.SPT3G_D1_TnE,
                  "variant": "lite",
                  "clear_internal_priors": True,
                  "additional_args": {},
                  "feedback": True,
                  "wrapper": None,
              },
          }

          # ----------------------------------------------------
          # Gaussian calibration terms used by the official
          # ACT/SPT Cobaya configurations.
          # ----------------------------------------------------
          prior = {
              "cal_dip_prior": (
                  "lambda A_act: "
                  "stats.norm.logpdf(A_act, loc=1.0, scale=0.003)"
              ),
              "gaussian_Tcal": (
                  "lambda Tcal: "
                  "stats.norm.logpdf(Tcal, loc=1.0, scale=0.0036)"
              ),
          }

          # ----------------------------------------------------
          # Frozen mAxiCLASS theory
          # ----------------------------------------------------
          extra = {
              "non linear": "hmcode",
              "N_ur": 2.0328,
              "N_ncdm": 1,
              "T_ncdm": 0.71611,
              "lensing": "yes",
              "P_k_max_h/Mpc": 1.0,
          }

          if MODEL == "1ax":
              extra.update({
                  "N_mscf": 1,
                  "n_axion_mscf": "3",
                  "theta_ini_mscf": "2.8",
                  "theta_prime_ini_mscf": "0.",
                  "do_shooting": "yes",
                  "do_shooting_mscf": "yes",
                  "attractor_ic_scf": "no",
                  "loop_over_background_for_closure_relation": "no",
                  "background_Nloga": 100000,
                  "tol_shooting_deltaF": 0.01,
                  "tol_shooting_deltax": 0.01,
              })

          if MODEL == "2ax":
              extra.update({
                  "N_mscf": 2,
                  "n_axion_mscf": "3,3",
                  "theta_ini_mscf": "2.8,2.8",
                  "theta_prime_ini_mscf": "0.,0.",
                  "do_shooting": "yes",
                  "do_shooting_mscf": "yes",
                  "attractor_ic_scf": "no",
                  "loop_over_background_for_closure_relation": "no",
                  "background_Nloga": 100000,
                  "tol_shooting_deltaF": 0.01,
                  "tol_shooting_deltax": 0.01,
              })

          theory = {
              "classy": {
                  "path": str(MAXI),
                  "extra_args": extra,
              }
          }

          # ----------------------------------------------------
          # Helpers
          # ----------------------------------------------------
          num_re = re.compile(
              r"^\s*\d+\s+"
              r"([+-]?(?:\d+(?:\.\d*)?|\.\d+)(?:[eE][+-]?\d+)?)"
              r"\s+(\S+)"
          )

          def parse_minimum(path):
              path = Path(path)
              values = {}
              text = path.read_text(errors="ignore")

              for line in text.splitlines():
                  m = num_re.match(line)
                  if not m:
                      continue
                  try:
                      value = float(m.group(1))
                  except ValueError:
                      continue
                  name = m.group(2)
                  values[name] = value

              return values

          def effective_summary(minimum_path, phase):
              vals = parse_minimum(minimum_path)

              chi2_parts = {
                  k: v
                  for k, v in vals.items()
                  if k.startswith("chi2__")
              }

              likelihood_chi2 = float(sum(chi2_parts.values()))

              tau = vals.get("tau_reio", float("nan"))
              aact = vals.get("A_act", float("nan"))
              tcal = vals.get("Tcal", float("nan"))

              penalties = {}

              if math.isfinite(tau):
                  penalties["tau"] = ((tau - 0.051) / 0.006) ** 2
              else:
                  penalties["tau"] = float("nan")

              if math.isfinite(aact):
                  penalties["A_act_cal"] = ((aact - 1.0) / 0.003) ** 2
              else:
                  penalties["A_act_cal"] = float("nan")

              if math.isfinite(tcal):
                  penalties["Tcal"] = ((tcal - 1.0) / 0.0036) ** 2
              else:
                  penalties["Tcal"] = float("nan")

              finite_penalties = [
                  x for x in penalties.values()
                  if math.isfinite(x)
              ]

              effective_chi2 = likelihood_chi2 + sum(finite_penalties)

              return {
                  "model": MODEL,
                  "phase": phase,
                  "minimum_file": str(minimum_path),
                  "likelihood_chi2": likelihood_chi2,
                  "gaussian_penalties": penalties,
                  "effective_chi2": effective_chi2,
                  "chi2_components": chi2_parts,
                  "parameters": vals,
                  "f2_boundary": (
                      vals.get("f_ax2") is not None
                      and vals.get("f_ax2") <= 1e-4
                  ),
              }

          def set_refs_from_values(info, vals):
              # Top-level sampled parameters
              for name, cfg in info.get("params", {}).items():
                  if (
                      isinstance(cfg, dict)
                      and "prior" in cfg
                      and name in vals
                      and math.isfinite(vals[name])
                  ):
                      cfg["ref"] = vals[name]

              # ACT nuisance parameters live inside its likelihood block
              act_cfg = info["likelihood"][act_name]
              for name, cfg in act_cfg.get("params", {}).items():
                  if name in vals and math.isfinite(vals[name]):
                      cfg["ref"] = vals[name]

          def make_info(output, phase, refs=None):
              info = {
                  "packages_path": os.environ["COBAYA_PACKAGES_PATH"],
                  "likelihood": copy.deepcopy(likelihood),
                  "params": copy.deepcopy(params),
                  "prior": copy.deepcopy(prior),
                  "theory": copy.deepcopy(theory),
                  "output": output,
                  "debug": False,
                  "force": True,
                  "timing": True,
              }

              if refs:
                  set_refs_from_values(info, refs)

              if phase == "smoke":
                  info["sampler"] = {
                      "evaluate": None
                  }

              elif phase == "low":
                  info["sampler"] = {
                      "minimize": {
                          "method": "bobyqa",
                          "ignore_prior": False,
                          "max_evals": 900,
                          "best_of": 2,
                          "seed": {
                              "lcdm": 13001,
                              "1ax": 13011,
                              "2ax": 13021,
                          }[MODEL],
                          "override_bobyqa": {
                              "rhoend": 0.05
                          },
                      }
                  }

              elif phase == "refine":
                  info["sampler"] = {
                      "minimize": {
                          "method": "bobyqa",
                          "ignore_prior": False,
                          "max_evals": 500,
                          "best_of": 1,
                          "seed": {
                              "lcdm": 23001,
                              "1ax": 23011,
                              "2ax": 23021,
                          }[MODEL],
                          "override_bobyqa": {
                              "rhoend": 0.02
                          },
                      }
                  }

              else:
                  raise ValueError(phase)

              return info

          # ----------------------------------------------------
          # 1) Combined finite-likelihood smoke evaluation
          # ----------------------------------------------------
          print("=" * 70)
          print("MODEL:", MODEL)
          print("GATE-P COMBINED SMOKE EVALUATION")
          print("=" * 70)

          smoke_prefix = f"chains/{MODEL}_smoke"
          smoke_info = make_info(smoke_prefix, "smoke")
          run(smoke_info)

          # ----------------------------------------------------
          # 2) Multi-start main minimisation
          # ----------------------------------------------------
          print("=" * 70)
          print("LOW-PRECISION GLOBAL SEARCH")
          print("=" * 70)

          low_prefix = f"chains/{MODEL}_low"
          low_info = make_info(low_prefix, "low")

          t0 = time.time()
          run(low_info)
          low_seconds = time.time() - t0

          low_min = Path(low_prefix + ".minimum")
          if not low_min.exists():
              raise FileNotFoundError(low_min)

          low_summary = effective_summary(low_min, "low")
          low_summary["runtime_seconds"] = low_seconds

          (RESULT_DIR / "summary_low.json").write_text(
              json.dumps(low_summary, indent=2, allow_nan=True) + "\n"
          )

          print("LOW effective chi2:", low_summary["effective_chi2"])
          print("LOW runtime seconds:", low_seconds)

          # ----------------------------------------------------
          # 3) Refine from recovered low minimum
          # ----------------------------------------------------
          print("=" * 70)
          print("REFINEMENT SEARCH")
          print("=" * 70)

          low_vals = low_summary["parameters"]

          refine_prefix = f"chains/{MODEL}_refine"
          refine_info = make_info(
              refine_prefix,
              "refine",
              refs=low_vals,
          )

          t1 = time.time()
          run(refine_info)
          refine_seconds = time.time() - t1

          refine_min = Path(refine_prefix + ".minimum")
          if not refine_min.exists():
              raise FileNotFoundError(refine_min)

          refine_summary = effective_summary(
              refine_min,
              "refine",
          )
          refine_summary["runtime_seconds"] = refine_seconds

          (RESULT_DIR / "summary_refine.json").write_text(
              json.dumps(refine_summary, indent=2, allow_nan=True) + "\n"
          )

          # Never throw away the better valid minimum.
          candidates = [low_summary, refine_summary]
          best = min(
              candidates,
              key=lambda x: x["effective_chi2"]
              if math.isfinite(x["effective_chi2"])
              else float("inf")
          )

          best = copy.deepcopy(best)
          best["selected_from"] = [
              {
                  "phase": x["phase"],
                  "effective_chi2": x["effective_chi2"],
              }
              for x in candidates
          ]

          (RESULT_DIR / "summary.json").write_text(
              json.dumps(best, indent=2, allow_nan=True) + "\n"
          )

          print("=" * 70)
          print("SELECTED BEST:", best["phase"])
          print("EFFECTIVE CHI2:", best["effective_chi2"])
          print("=" * 70)
          PY

      - name: Run overnight Gate-P fit
        id: overnight
        continue-on-error: true
        env:
          GATEP_MODEL: ${{ matrix.model }}
        run: |
          # Leave time for recovery + artifact upload before the GitHub
          # hosted-runner hard timeout.
          set +e
          timeout --signal=TERM --kill-after=60s 325m \
            python run_gatep_fit.py \
            2>&1 | tee results/${{ matrix.model }}/fit.log

          code=${PIPESTATUS[0]}
          echo "fit_exit_code=$code" | tee results/${{ matrix.model }}/fit_exit_code.txt
          exit 0

      - name: Recover best available summary
        if: always()
        env:
          GATEP_MODEL: ${{ matrix.model }}
        run: |
          python - <<'PY'
          import json
          import math
          import os
          import shutil
          from pathlib import Path

          model = os.environ["GATEP_MODEL"]
          d = Path("results") / model
          d.mkdir(parents=True, exist_ok=True)

          final = d / "summary.json"
          low = d / "summary_low.json"
          refine = d / "summary_refine.json"

          if final.exists():
              print("Final summary already exists:", final)
          elif refine.exists() and low.exists():
              a = json.loads(low.read_text())
              b = json.loads(refine.read_text())
              best = min(
                  [a, b],
                  key=lambda x: x.get("effective_chi2", float("inf"))
              )
              best["recovered_after_interruption"] = True
              final.write_text(json.dumps(best, indent=2) + "\n")
              print("Recovered best of low/refine.")
          elif low.exists():
              data = json.loads(low.read_text())
              data["recovered_after_interruption"] = True
              data["note"] = "Refinement did not finish; low-phase minimum retained."
              final.write_text(json.dumps(data, indent=2) + "\n")
              print("Recovered low-phase result.")
          else:
              final.write_text(json.dumps({
                  "model": model,
                  "status": "NO_COMPLETED_MINIMUM",
                  "note": "Smoke or main minimisation failed before a minimum was written."
              }, indent=2) + "\n")
              print("No completed minimum available.")
          PY

      - name: Record exact runtime provenance
        if: always()
        env:
          GATEP_MODEL: ${{ matrix.model }}
        run: |
          {
            echo "case=CASE-Q013"
            echo "model=$GATEP_MODEL"
            echo "timestamp_utc=$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "runner=$RUNNER_OS"
            echo "python=$(python --version 2>&1)"
            echo "pip=$(python -m pip --version)"
            echo "gcc=$(gcc --version | head -n1)"
            echo "mAxiCLASS=$(git -C external/mAxiCLASS rev-parse HEAD)"
            echo "ACT_DR6=$(git -C external/DR6-ACT-lite rev-parse HEAD)"
            echo "SPT_candl_data=$(git -C external/spt_candl_data rev-parse HEAD)"
            python - <<'PY'
          import Cython
          import cobaya
          import candl
          import camb
          print("Cython=" + Cython.__version__)
          print("Cobaya=" + cobaya.__version__)
          print("candl_file=" + candl.__file__)
          print("CAMB_validation=" + camb.__version__)
          PY
          } | tee results/${{ matrix.model }}/runtime.txt

          python -m pip freeze | sort \
            > results/${{ matrix.model }}/pip-freeze.txt

      - name: Upload model artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatep-fit-${{ matrix.model }}-${{ github.run_id }}
          path: |
            results/${{ matrix.model }}/
            chains/${{ matrix.model }}_*
            provenance/GATEP_OVERNIGHT_CONTRACT.txt
          if-no-files-found: warn
          retention-days: 30

  # ==========================================================
  # AUTOMATIC COMPARISON
  # ==========================================================
  summarize:
    name: "Gate-P compare models"
    needs: fit
    if: always()
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - name: Download all available fit artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: gatep-fit-*-${{ github.run_id }}
          path: gathered

      - name: Build Gate-P comparison
        run: |
          mkdir -p final

          python - <<'PY'
          import json
          import math
          from pathlib import Path

          root = Path("gathered")
          summaries = {}

          # Prefer summary.json from each artifact.
          for p in root.rglob("summary.json"):
              try:
                  data = json.loads(p.read_text())
              except Exception:
                  continue

              model = data.get("model")
              if model in {"lcdm", "1ax", "2ax"}:
                  summaries[model] = data

          out = {
              "case": "CASE-Q013",
              "gate": "Gate P",
              "models_found": sorted(summaries),
              "models": summaries,
              "status": "INCOMPLETE",
          }

          required = {"lcdm", "1ax", "2ax"}

          if required.issubset(summaries):
              try:
                  c0 = float(summaries["lcdm"]["effective_chi2"])
                  c1 = float(summaries["1ax"]["effective_chi2"])
                  c2 = float(summaries["2ax"]["effective_chi2"])

                  d21 = c2 - c1
                  daic = d21 + 4.0

                  tolerance = 0.2

                  nesting_21 = c2 <= c1 + tolerance
                  nesting_10 = c1 <= c0 + tolerance

                  p2 = summaries["2ax"].get("parameters", {})
                  f2 = p2.get("f_ax2")
                  field2_relevant = (
                      f2 is not None
                      and math.isfinite(float(f2))
                      and float(f2) > 1e-4
                  )

                  if not nesting_21 or not nesting_10:
                      route = (
                          "NUMERICAL WARNING: nesting check failed; "
                          "do not interpret Gate P until global minimum is recovered."
                      )
                  elif d21 < -4.0 and field2_relevant:
                      route = (
                          "PRELIMINARY GATE-P PASS: 2ax beats 1ax after AIC "
                          "and field 2 is non-boundary. Next: theory precision "
                          "|delta chi2_theory|<=0.1, high-l ell~800-1200 "
                          "decomposition, then Gate F."
                      )
                  elif not field2_relevant:
                      route = (
                          "PRELIMINARY NEGATIVE: field 2 is at/near the "
                          "numerical boundary and is not physically relevant."
                      )
                  else:
                      route = (
                          "PRELIMINARY NEGATIVE: field 2 is not AIC-justified "
                          "on external ACT+SPT primary CMB."
                      )

                  out.update({
                      "status": "PRELIMINARY_NUMERICAL_RESULT",
                      "chi2_lcdm": c0,
                      "chi2_1ax": c1,
                      "chi2_2ax": c2,
                      "delta_chi2_2ax_minus_1ax": d21,
                      "delta_AIC_2ax_minus_1ax": daic,
                      "AIC_neutral_delta_chi2": -4.0,
                      "nesting_2ax_le_1ax": nesting_21,
                      "nesting_1ax_le_lcdm": nesting_10,
                      "nesting_tolerance": tolerance,
                      "f_ax2": f2,
                      "field2_relevant_threshold": 1e-4,
                      "field2_relevant": field2_relevant,
                      "route": route,
                      "finality": (
                          "NOT FINAL. Requires theory-precision rerun and "
                          "paper-production base-prior provenance closure. "
                          "No Wilks/sigma conversion."
                      ),
                  })

              except Exception as exc:
                  out["status"] = "COMPARISON_ERROR"
                  out["error"] = repr(exc)

          Path("final/gatep_comparison.json").write_text(
              json.dumps(out, indent=2, allow_nan=True) + "\n"
          )

          # Human-readable report
          lines = []
          lines.append("# Bubbleverse CASE-Q013 — Gate P overnight result")
          lines.append("")
          lines.append(f"Status: **{out['status']}**")
          lines.append("")

          if "chi2_lcdm" in out:
              lines.append(f"- chi2 LCDM: `{out['chi2_lcdm']:.6f}`")
              lines.append(f"- chi2 1ax: `{out['chi2_1ax']:.6f}`")
              lines.append(f"- chi2 2ax: `{out['chi2_2ax']:.6f}`")
              lines.append(
                  f"- delta chi2 (2ax-1ax): "
                  f"`{out['delta_chi2_2ax_minus_1ax']:.6f}`"
              )
              lines.append(
                  f"- delta AIC (2ax-1ax): "
                  f"`{out['delta_AIC_2ax_minus_1ax']:.6f}`"
              )
              lines.append(
                  f"- nesting 2ax<=1ax: `{out['nesting_2ax_le_1ax']}`"
              )
              lines.append(
                  f"- nesting 1ax<=LCDM: `{out['nesting_1ax_le_lcdm']}`"
              )
              lines.append(f"- f_ax2: `{out['f_ax2']}`")
              lines.append("")
              lines.append("## Route")
              lines.append(out["route"])
              lines.append("")
              lines.append("## Epistemic status")
              lines.append(out["finality"])
          else:
              lines.append(
                  "One or more model minima are missing. "
                  "Inspect individual model artifacts."
              )

          report = "\n".join(lines) + "\n"
          Path("final/gatep_report.md").write_text(report)

          print(report)
          PY

          cat final/gatep_report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload final Gate-P comparison
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatep-final-${{ github.run_id }}
          path: final/
          if-no-files-found: warn
          retention-days: 30
