name: Bubbleverse Gate P - GLOBALITY RECOVERY

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUNBUFFERED: "1"
  MAXICLASS_COMMIT: b5a3af9818d04d2fe696e54972545e8c6805f4ea
  ACT_COMMIT: 0e0cd2c703c62a0e980470b572602233b27750e1
  SPT_COMMIT: 2cec6e762a8c540484dd5acafc529f0035856350
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/.cobaya

jobs:
  recover-1ax:
    runs-on: ubuntu-22.04
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ gfortran make git
      - name: Install frozen Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.37" "numpy==2.2.6" "scipy==1.15.3" "PyYAML==6.0.3" "cobaya==3.6.2" "Py-BOBYQA==1.5.0" "candl-like==2.0.3" "sacc==2.4" "astropy==6.1.7" "camb==1.5.9" "pytest==9.1.1"
      - name: Frozen mAxiCLASS
        run: |
          mkdir -p external
          git clone https://github.com/marcobeIIa/mAxiCLASS.git external/mAxiCLASS
          git -C external/mAxiCLASS checkout "$MAXICLASS_COMMIT"
          make -C external/mAxiCLASS -j2
      - name: Frozen ACT DR6 + official data
        run: |
          git clone https://github.com/ACTCollaboration/DR6-ACT-lite.git external/DR6-ACT-lite
          git -C external/DR6-ACT-lite checkout "$ACT_COMMIT"
          python -m pip install -e external/DR6-ACT-lite
          mkdir -p "$COBAYA_PACKAGES_PATH"
          cobaya-install act_dr6_cmbonly --packages-path "$COBAYA_PACKAGES_PATH"
      - name: Frozen SPT-3G D1
        run: |
          git clone https://github.com/SouthPoleTelescope/spt_candl_data.git external/spt_candl_data
          git -C external/spt_candl_data checkout "$SPT_COMMIT"
          python -m pip install -e external/spt_candl_data
      - name: Record provenance
        run: |
          mkdir -p gatep_recovery/provenance
          python -m pip freeze > gatep_recovery/provenance/pip-freeze.txt
          git -C external/mAxiCLASS rev-parse HEAD > gatep_recovery/provenance/maxiclass-commit.txt
          git -C external/DR6-ACT-lite rev-parse HEAD > gatep_recovery/provenance/act-commit.txt
          git -C external/spt_candl_data rev-parse HEAD > gatep_recovery/provenance/spt-commit.txt
          cp scripts/GATEP_RECOVERY_PROVENANCE.md gatep_recovery/provenance/
      - name: ACT validation
        run: pytest -q --pyargs act_dr6_cmbonly | tee gatep_recovery/provenance/act-validation.log
      - name: Recover LCDM + 1ax
        run: python scripts/gatep_globality_recovery.py --stage 1ax --workdir gatep_recovery
      - name: Upload 1ax recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatep-globality-1ax
          path: gatep_recovery/
          retention-days: 30

  recover-2ax:
    needs: recover-1ax
    runs-on: ubuntu-22.04
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - uses: actions/download-artifact@v4
        with:
          name: gatep-globality-1ax
          path: gatep_recovery
      - name: Install system tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc g++ gfortran make git
      - name: Install frozen Python runtime
        run: |
          python -m pip install --upgrade pip
          python -m pip install "Cython==0.29.37" "numpy==2.2.6" "scipy==1.15.3" "PyYAML==6.0.3" "cobaya==3.6.2" "Py-BOBYQA==1.5.0" "candl-like==2.0.3" "sacc==2.4" "astropy==6.1.7" "camb==1.5.9" "pytest==9.1.1"
      - name: Frozen mAxiCLASS
        run: |
          mkdir -p external
          git clone https://github.com/marcobeIIa/mAxiCLASS.git external/mAxiCLASS
          git -C external/mAxiCLASS checkout "$MAXICLASS_COMMIT"
          make -C external/mAxiCLASS -j2
      - name: Frozen ACT DR6 + official data
        run: |
          git clone https://github.com/ACTCollaboration/DR6-ACT-lite.git external/DR6-ACT-lite
          git -C external/DR6-ACT-lite checkout "$ACT_COMMIT"
          python -m pip install -e external/DR6-ACT-lite
          mkdir -p "$COBAYA_PACKAGES_PATH"
          cobaya-install act_dr6_cmbonly --packages-path "$COBAYA_PACKAGES_PATH"
      - name: Frozen SPT-3G D1
        run: |
          git clone https://github.com/SouthPoleTelescope/spt_candl_data.git external/spt_candl_data
          git -C external/spt_candl_data checkout "$SPT_COMMIT"
          python -m pip install -e external/spt_candl_data
      - name: Record provenance
        run: |
          python -m pip freeze > gatep_recovery/provenance/pip-freeze-2ax.txt
          git -C external/mAxiCLASS rev-parse HEAD > gatep_recovery/provenance/maxiclass-commit-2ax.txt
          git -C external/DR6-ACT-lite rev-parse HEAD > gatep_recovery/provenance/act-commit-2ax.txt
          git -C external/spt_candl_data rev-parse HEAD > gatep_recovery/provenance/spt-commit-2ax.txt
      - name: Recover 2ax from recovered 1ax
        run: python scripts/gatep_globality_recovery.py --stage 2ax --workdir gatep_recovery
      - name: Build comparison report
        run: python scripts/gatep_globality_recovery.py --stage report --workdir gatep_recovery
      - name: Upload complete recovery
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatep-globality-recovery
          path: gatep_recovery/
          retention-days: 30
