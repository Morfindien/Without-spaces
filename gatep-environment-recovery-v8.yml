name: Bubbleverse Gate P - ENVIRONMENT RECOVERY

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

env:
  PYTHONUNBUFFERED: "1"
  COBAYA_PACKAGES_PATH: ${{ github.workspace }}/.cobaya

  # Frozen Gate-P provenance. DO NOT change these to make a run pass.
  MAXICLASS_COMMIT: b5a3af9818d04d2fe696e54972545e8c6805f4ea
  ACT_COMMIT: 0e0cd2c703c62a0e980470b572602233b27750e1
  SPT_COMMIT: 2cec6e762a8c540484dd5acafc529f0035856350

jobs:
  environment-recovery:
    # Match the successful Globality Recovery runner family first.
    runs-on: ubuntu-22.04
    timeout-minutes: 180

    steps:
      - name: Checkout Bubbleverse repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install system build tools
        run: |
          set -euxo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            gcc \
            g++ \
            gfortran \
            make \
            git \
            git-lfs \
            unzip

      - name: Install frozen Python runtime
        run: |
          set -euxo pipefail
          python -m pip install --upgrade pip
          python -m pip install \
            "Cython==0.29.37" \
            "numpy==2.2.6" \
            "scipy==1.15.3" \
            "PyYAML==6.0.3" \
            "cobaya==3.6.2" \
            "Py-BOBYQA==1.5.0" \
            "candl-like==2.0.3" \
            "sacc==2.4" \
            "astropy==6.1.7" \
            "camb==1.5.9" \
            "pytest==9.1.1" \
            "pandas==2.3.3"

      - name: Clone frozen Gate-P sources
        run: |
          set -euxo pipefail
          rm -rf external/mAxiCLASS external/DR6-ACT-lite external/spt_candl_data
          mkdir -p external

          git clone https://github.com/marcobeIIa/mAxiCLASS.git external/mAxiCLASS
          git -C external/mAxiCLASS checkout "$MAXICLASS_COMMIT"

          git clone https://github.com/ACTCollaboration/DR6-ACT-lite.git external/DR6-ACT-lite
          git -C external/DR6-ACT-lite checkout "$ACT_COMMIT"

          git clone https://github.com/SouthPoleTelescope/spt_candl_data.git external/spt_candl_data
          git -C external/spt_candl_data checkout "$SPT_COMMIT"
          git -C external/spt_candl_data lfs pull || true

          test "$(git -C external/mAxiCLASS rev-parse HEAD)" = "$MAXICLASS_COMMIT"
          test "$(git -C external/DR6-ACT-lite rev-parse HEAD)" = "$ACT_COMMIT"
          test "$(git -C external/spt_candl_data rev-parse HEAD)" = "$SPT_COMMIT"

      - name: Build and install frozen mAxiCLASS
        run: |
          set -euxo pipefail

          # Q013 needs BOTH:
          # 1) local build/lib* for Cobaya when theory.classy.path points to
          #    external/mAxiCLASS
          # 2) normal package installation for runtime data such as
          #    external/bbn/sBBN_2025.dat

          python -m pip uninstall -y classy || true

          (
            cd external/mAxiCLASS
            make clean || true
            make PYTHON="$(which python)" libclass.a -j2

            # Create the local build tree Cobaya explicitly searches.
            PYTHON="$(which python)" python setup.py build

            # Install the same frozen source so package data are available.
            PYTHON="$(which python)"               python -m pip install -v --no-build-isolation --no-deps .
          )

          python - <<'PY'
          import glob
          import importlib.util
          from pathlib import Path

          repo = Path("external/mAxiCLASS").resolve()

          build_dirs = [
              Path(p).resolve()
              for p in glob.glob(str(repo / "build" / "lib*"))
              if Path(p).is_dir()
          ]
          if not build_dirs:
              raise SystemExit(
                  "FAIL: mAxiCLASS local build/lib* directory was not created"
              )

          compiled = []
          for b in build_dirs:
              compiled.extend(b.glob("classy*.so"))
              compiled.extend(b.glob("classy*.pyd"))

          if not compiled:
              raise SystemExit(
                  "FAIL: no compiled classy extension found in local build dirs: "
                  + ", ".join(str(x) for x in build_dirs)
              )

          print("Cobaya local build dirs:")
          for b in build_dirs:
              print(" ", b)
          print("Compiled local classy:")
          for p in compiled:
              print(" ", p.resolve())

          spec = importlib.util.find_spec("class")
          if spec is None:
              raise SystemExit(
                  "FAIL: installed mAxiCLASS data package 'class' not found"
              )

          if spec.submodule_search_locations:
              class_root = Path(next(iter(spec.submodule_search_locations))).resolve()
          elif spec.origin:
              class_root = Path(spec.origin).resolve().parent
          else:
              raise SystemExit(
                  "FAIL: unable to resolve installed 'class' package root"
              )

          bbn = class_root / "external" / "bbn" / "sBBN_2025.dat"
          print("CLASS package-data root =", class_root)
          print("Required BBN file =", bbn)

          if not bbn.is_file():
              raise SystemExit(f"FAIL: missing {bbn}")
          if bbn.stat().st_size <= 0:
              raise SystemExit(f"FAIL: empty {bbn}")

          with bbn.open("rb") as f:
              f.read(1)

          print("Local Cobaya build gate: PASS")
          print("BBN package-data gate: PASS")
          PY

      - name: Install frozen ACT likelihood
        run: |
          set -euxo pipefail
          python -m pip install -e external/DR6-ACT-lite

      - name: Restore frozen ACT data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ACT_DIR="$COBAYA_PACKAGES_PATH/data/ACTDR6CMBonly/v1.0"
          ACT_FILE="$ACT_DIR/dr6_data_cmbonly.fits"
          mkdir -p "$ACT_DIR"

          # Prefer the preserved data artifact used by the successful frozen
          # Gate-P recovery. If unavailable, use the official installer.
          if gh api \
              -H "Accept: application/vnd.github+json" \
              "/repos/${{ github.repository }}/actions/artifacts/9533873703/zip" \
              > /tmp/act-dr6-data.zip
          then
            unzip -j -o \
              /tmp/act-dr6-data.zip \
              "dr6_data_cmbonly.fits" \
              -d "$ACT_DIR"
          else
            rm -f /tmp/act-dr6-data.zip
            cobaya-install \
              act_dr6_cmbonly \
              --packages-path "$COBAYA_PACKAGES_PATH"
          fi

          test -s "$ACT_FILE"
          sha256sum "$ACT_FILE"

      - name: Install frozen SPT-3G D1 data package
        run: |
          set -euxo pipefail

          # The frozen SouthPoleTelescope repository installs the Python
          # package `spt_candl_data`. `candl_data` is a separate optional
          # candl data library and is NOT required for this frozen SPT-D1 path.
          python -m pip install -e external/spt_candl_data

          python - <<'PY'
          from pathlib import Path
          import candl
          import spt_candl_data

          print("candl =", Path(candl.__file__).resolve())
          print("spt_candl_data =", Path(spt_candl_data.__file__).resolve())

          frozen = Path("external/spt_candl_data").resolve()
          loaded = Path(spt_candl_data.__file__).resolve()

          try:
              loaded.relative_to(frozen)
          except ValueError:
              raise SystemExit(
                  f"FAIL: spt_candl_data loaded from {loaded}, "
                  f"not frozen checkout {frozen}"
              )

          print("spt_candl_data frozen-source gate: PASS")
          PY

      - name: Record recovery provenance
        if: always()
        run: |
          set -u
          mkdir -p gatep_environment_recovery/provenance

          python --version \
            > gatep_environment_recovery/provenance/python-version.txt 2>&1 || true
          python -m pip freeze \
            > gatep_environment_recovery/provenance/pip-freeze.txt 2>&1 || true

          git rev-parse HEAD \
            > gatep_environment_recovery/provenance/bubbleverse-commit.txt 2>&1 || true
          git -C external/mAxiCLASS rev-parse HEAD \
            > gatep_environment_recovery/provenance/maxiclass-commit.txt 2>&1 || true
          find external/mAxiCLASS/build -maxdepth 3 -type f -name 'classy*' -print \
            > gatep_environment_recovery/provenance/maxiclass-local-build.txt 2>&1 || true
          git -C external/DR6-ACT-lite rev-parse HEAD \
            > gatep_environment_recovery/provenance/act-commit.txt 2>&1 || true
          git -C external/spt_candl_data rev-parse HEAD \
            > gatep_environment_recovery/provenance/spt-commit.txt 2>&1 || true

          python - <<'PY' > gatep_environment_recovery/provenance/import-paths.txt 2>&1 || true
          import importlib.util
          from pathlib import Path

          for name in ("classy", "class", "act_dr6_cmbonly", "candl", "spt_candl_data"):
              spec = importlib.util.find_spec(name)
              print(name, "=>", None if spec is None else {
                  "origin": spec.origin,
                  "locations": list(spec.submodule_search_locations or []),
              })
          PY

      - name: Hard environment preflight
        run: |
          set -euxo pipefail
          test -s scripts/gatep_environment_preflight.py
          python scripts/gatep_environment_preflight.py

      - name: ACT Gate-P benchmark validation
        run: |
          set -euxo pipefail
          mkdir -p gatep_environment_recovery/benchmarks

          # Do not run the complete upstream test_act.py here.
          # test_install() can install a Cobaya-managed CAMB under
          # $COBAYA_PACKAGES_PATH/code/CAMB, shadowing pinned camb==1.5.9.
          # test_Planck() requires PlanckActCut data, outside frozen Gate-P.

          rm -rf "$COBAYA_PACKAGES_PATH/code/CAMB"

          python - <<'PY' \
            | tee gatep_environment_recovery/benchmarks/camb-runtime.log
          from pathlib import Path
          import camb

          print("camb.__version__ =", getattr(camb, "__version__", None))
          print("camb.__file__ =", Path(camb.__file__).resolve())

          expected = "1.5.9"
          got = getattr(camb, "__version__", None)
          if got != expected:
              raise SystemExit(
                  f"FAIL: expected pinned camb=={expected}, loaded {got!r}"
              )

          loaded = Path(camb.__file__).resolve()
          cobaya_code = Path(".cobaya/code/CAMB").resolve()
          try:
              loaded.relative_to(cobaya_code)
          except ValueError:
              pass
          else:
              raise SystemExit(
                  "FAIL: CAMB is being shadowed by a Cobaya-installed copy: "
                  f"{loaded}"
              )

          print("Pinned CAMB runtime gate: PASS")
          PY

          pytest -q \
            external/DR6-ACT-lite/act_dr6_cmbonly/tests/test_act.py::test_import \
            external/DR6-ACT-lite/act_dr6_cmbonly/tests/test_act.py::test_model \
            external/DR6-ACT-lite/act_dr6_cmbonly/tests/test_act.py::test_TTTEEE \
            | tee gatep_environment_recovery/benchmarks/act-validation.log

      - name: Run recovered differential reference chain
        env:
          PYTHONFAULTHANDLER: "1"
        run: |
          set -euxo pipefail

          # Use the existing Bubbleverse differential program after the
          # environment has passed every hard gate.
          python scripts/gatep_differential_debug.py

          # Preserve it under this recovery artifact as well.
          rm -rf gatep_environment_recovery/differential_debug
          cp -a \
            gatep_differential_debug \
            gatep_environment_recovery/differential_debug

      - name: Diagnose and enforce known-good numerical recovery
        run: |
          set -euxo pipefail
          python - <<'PY'
          import json
          import math
          import re
          from pathlib import Path

          R1 = 317.4238643933
          OLD_ZERO = 317.4201095748994
          TOL = 0.1

          root = Path("gatep_environment_recovery/differential_debug")
          out = Path("gatep_environment_recovery/diagnostics")
          out.mkdir(parents=True, exist_ok=True)

          def find_json():
              preferred = [
                  root / "differential_debug.json",
                  root / "summary.json",
                  root / "result.json",
              ]
              for p in preferred:
                  if p.exists():
                      return p
              candidates = sorted(root.rglob("*.json"))
              if not candidates:
                  raise SystemExit("FAIL: no differential JSON result produced")
              return candidates[0]

          summary = find_json()
          data = json.loads(summary.read_text())
          tests = data.get("results", data.get("tests", data))
          rows = []

          if isinstance(tests, dict):
              for key, value in tests.items():
                  if isinstance(value, dict):
                      row = dict(value)
                      row.setdefault("label", key)
                      rows.append(row)
          elif isinstance(tests, list):
              rows = [r for r in tests if isinstance(r, dict)]

          wanted = [
              "known_good_globality_cli",
              "known_good_globality_module",
              "boundary_2ax_module",
              "plain_lcdm_module",
          ]

          def get_row(label):
              return next((r for r in rows if r.get("label") == label), None)

          def finite_number(x):
              return isinstance(x, (int, float)) and math.isfinite(x)

          def pick(row, *names):
              if not isinstance(row, dict):
                  return None
              for n in names:
                  if n in row:
                      return row[n]
              return None

          def row_is_finite(row):
              if not isinstance(row, dict):
                  return False
              usable = pick(row, "usable_finite", "finite_usable", "finite")
              eff = pick(row, "effective_chi2", "chi2_eff", "effective_chi2_table", "chi2_total")
              return bool(usable) and finite_number(eff)

          error_patterns = re.compile(
              r"(error|exception|failed|failure|nan|inf|segmentation|could not|missing|traceback|classy|likelihood)",
              re.I,
          )

          diagnostic = {
              "source_json": str(summary),
              "R1": R1,
              "OLD_ZERO": OLD_ZERO,
              "TOL": TOL,
              "cases": {},
          }

          print("\n=== GATE-P REFERENCE DIAGNOSTIC ===")
          print("Source JSON:", summary)

          for label in wanted:
              row = get_row(label)
              print(f"\n--- {label} ---")
              if row is None:
                  print("MISSING RESULT ROW")
                  diagnostic["cases"][label] = {"missing": True}
                  continue

              usable = pick(row, "usable_finite", "finite_usable", "finite")
              eff = pick(row, "effective_chi2", "chi2_eff", "effective_chi2_table", "chi2_total")
              act = pick(row, "chi2_ACT_log", "chi2_act", "ACT_chi2", "act_chi2")
              spt = pick(row, "chi2_SPT_log", "chi2_spt", "SPT_chi2", "spt_chi2")
              exit_code = pick(row, "exit", "exit_code", "returncode")
              log_path = pick(row, "log", "log_path", "stdout_log")

              print("exit_code =", exit_code)
              print("usable_finite =", usable)
              print("effective_chi2 =", eff)
              print("ACT_chi2 =", act)
              print("SPT_chi2 =", spt)
              print("log_path =", log_path)

              candidates = []
              if isinstance(log_path, str):
                  candidates.append(root / log_path)
                  candidates.append(Path(log_path))
              candidates += list(root.rglob(f"*{label}*.log"))

              seen = set()
              first_errors = []
              for lp in candidates:
                  try:
                      rp = lp.resolve()
                  except Exception:
                      continue
                  if rp in seen or not lp.exists() or not lp.is_file():
                      continue
                  seen.add(rp)
                  try:
                      for line in lp.read_text(errors="replace").splitlines():
                          if error_patterns.search(line):
                              first_errors.append(line[:1000])
                              if len(first_errors) >= 25:
                                  break
                  except Exception as exc:
                      first_errors.append(f"[log read failed: {exc!r}]")
                  if len(first_errors) >= 25:
                      break

              diagnostic["cases"][label] = {"row": row, "first_error_lines": first_errors}
              if first_errors:
                  print("first_error_lines:")
                  for line in first_errors:
                      print("  ", line)
              else:
                  print("first_error_lines: NONE EXTRACTED")

          cli = get_row("known_good_globality_cli")
          mod = get_row("known_good_globality_module")
          b2 = get_row("boundary_2ax_module")
          lcdm = get_row("plain_lcdm_module")

          cli_ok = row_is_finite(cli)
          mod_ok = row_is_finite(mod)
          b2_ok = row_is_finite(b2)
          lcdm_ok = row_is_finite(lcdm)

          if cli_ok:
              classification = "KNOWN_GOOD_CLI_FINITE"
          elif mod_ok:
              classification = "CLI_INVOCATION_OR_CONFIG_TRANSLATION_FAILURE"
          elif lcdm_ok or b2_ok:
              classification = "KNOWN_GOOD_CONFIG_OR_WRAPPER_FAILURE"
          else:
              classification = "SHARED_NUMERICAL_OR_THEORY_PIPELINE_FAILURE"

          diagnostic["classification"] = classification
          print("\nCLASSIFICATION =", classification)

          (out / "known_good_diagnostic.json").write_text(
              json.dumps(diagnostic, indent=2, sort_keys=True, default=str)
          )

          report = [
              "# CASE-Q013 — Known-Good Numerical Recovery Diagnostic",
              "",
              f"Classification: **{classification}**",
              "",
              f"Reference R1: `{R1}`",
              f"Previous 2ax zero: `{OLD_ZERO}`",
              f"Tolerance: `{TOL}`",
              "",
          ]

          for label in wanted:
              report += [f"## {label}", ""]
              case = diagnostic["cases"].get(label, {})
              row = case.get("row") if isinstance(case, dict) else None
              if not row:
                  report += ["Missing result row.", ""]
                  continue
              report += [
                  f"- exit: `{pick(row, 'exit', 'exit_code', 'returncode')}`",
                  f"- usable_finite: `{pick(row, 'usable_finite', 'finite_usable', 'finite')}`",
                  f"- effective_chi2: `{pick(row, 'effective_chi2', 'chi2_eff', 'effective_chi2_table', 'chi2_total')}`",
                  f"- ACT chi2: `{pick(row, 'chi2_ACT_log', 'chi2_act', 'ACT_chi2', 'act_chi2')}`",
                  f"- SPT chi2: `{pick(row, 'chi2_SPT_log', 'chi2_spt', 'SPT_chi2', 'spt_chi2')}`",
                  "",
              ]
              errs = case.get("first_error_lines", [])
              if errs:
                  report += ["First extracted error lines:", "", "```text"]
                  report += errs[:25]
                  report += ["```", ""]

          (out / "KNOWN_GOOD_DIAGNOSTIC.md").write_text("\n".join(report) + "\n")

          if not cli_ok:
              raise SystemExit(
                  "FAIL: known_good_globality_cli is still non-finite. "
                  f"Classification={classification}. "
                  "See diagnostics/KNOWN_GOOD_DIAGNOSTIC.md."
              )

          eff = pick(cli, "effective_chi2", "chi2_eff", "effective_chi2_table", "chi2_total")
          act = pick(cli, "chi2_ACT_log", "chi2_act", "ACT_chi2", "act_chi2")
          spt = pick(cli, "chi2_SPT_log", "chi2_spt", "SPT_chi2", "spt_chi2")

          if not finite_number(eff):
              raise SystemExit(f"FAIL: known-good effective chi2 is not finite: {eff!r}")
          if not finite_number(act) or not finite_number(spt):
              raise SystemExit(
                  f"FAIL: ACT/SPT components not individually finite: ACT={act!r}, SPT={spt!r}"
              )
          if abs(eff - OLD_ZERO) > TOL:
              raise SystemExit(
                  f"FAIL: 2ax zero not reproduced: chi2={eff}, old={OLD_ZERO}, "
                  f"|delta|={abs(eff-OLD_ZERO)} > {TOL}"
              )
          if abs(eff - R1) > TOL:
              raise SystemExit(
                  f"FAIL: 2ax zero not consistent with R1: chi2={eff}, R1={R1}, "
                  f"|delta|={abs(eff-R1)} > {TOL}"
              )

          print("\nKNOWN-GOOD REFERENCE CHAIN: RECOVERED")
          print("effective_chi2 =", eff)
          print("delta vs previous 2ax zero =", eff - OLD_ZERO)
          print("delta vs R1 =", eff - R1)
          PY

      - name: Build environment recovery summary
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path

          out = Path("gatep_environment_recovery")
          out.mkdir(exist_ok=True)
          report = out / "ENVIRONMENT_RECOVERY_REPORT.md"

          preflight = out / "PREFLIGHT_REPORT.md"
          diff = out / "differential_debug" / "DIFFERENTIAL_DEBUG_REPORT.md"

          text = [
              "# CASE-Q013 — Gate-P Environment Recovery",
              "",
              "This workflow repairs and validates the shared runtime before "
              "any Gate-P nesting interpretation is allowed.",
              "",
              "Hard rule: any missing dependency, missing BBN data, NaN, inf, "
              "-inf, crash, missing likelihood component, or missing result is "
              "**INVALID FOR NESTING**.",
              "",
          ]

          if preflight.exists():
              text += ["## Preflight", "", preflight.read_text(), ""]
          if diff.exists():
              text += ["## Differential reference chain", "", diff.read_text(), ""]

          diag = out / "diagnostics" / "KNOWN_GOOD_DIAGNOSTIC.md"
          if diag.exists():
              text += ["## Known-good numerical diagnostic", "", diag.read_text(), ""]

          report.write_text("\n".join(text))
          PY

          cat gatep_environment_recovery/ENVIRONMENT_RECOVERY_REPORT.md \
            >> "$GITHUB_STEP_SUMMARY" || true

      - name: Upload complete environment recovery artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gatep-environment-recovery-${{ github.run_id }}
          path: gatep_environment_recovery/
          if-no-files-found: warn
          retention-days: 90
